<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGRIWISE · Plan de la ferme</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1C5 6 3 8.5 3 11a5 5 0 0 0 10 0c0-2.5-2-5-5-10z' fill='%231e50a2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="plan-page">
<header class="topbar">
  <div class="brand"><span class="hanko" aria-hidden="true">絆</span>AGRIWISE<small>KIZUNA 2026</small></div>
  <nav class="nav" aria-label="Pages">
    <a href="./" aria-current="page">Plan de la ferme</a>
    <a href="zone.html">Zone</a>
    <a href="camera.html">Caméra</a>
  </nav>
  <div class="status" id="status" aria-live="polite"></div>
</header>

<main class="plan-main">
  <section class="plan-summary" aria-label="Résumé de la ferme">
    <div class="sum-counts" id="counts"></div>
    <ul class="plain issues-strip" id="issues" aria-label="Problèmes à traiter"></ul>
  </section>

  <section class="plan-wrap" aria-label="Plan de la ferme">
    <svg id="plan" class="plan" role="application" aria-label="Plan interactif : glisser pour se déplacer, molette ou pincer pour zoomer"
         tabindex="0"></svg>

    <div class="plan-tools tl">
      <div class="layers" role="group" aria-label="Afficher">
        <button class="chip" id="t-water" aria-pressed="true"><i class="sw sw-water"></i>Eau</button>
        <button class="chip" id="t-data" aria-pressed="true"><i class="sw sw-data"></i>Données</button>
      </div>
      <ul class="plain legend-zones" id="zone-list" aria-label="Zones"></ul>
    </div>

    <div class="plan-tools tr">
      <button class="chip" id="edit" aria-pressed="false">Réorganiser</button>
      <span id="edit-actions" hidden>
        <button class="chip primary" id="save">Enregistrer</button>
        <button class="chip" id="cancel">Annuler</button>
        <button class="chip" id="reset" title="Revenir à la disposition automatique">Par défaut</button>
      </span>
    </div>

    <div class="plan-tools br" role="group" aria-label="Zoom">
      <button class="zbtn" id="zin" aria-label="Zoomer">+</button>
      <button class="zbtn" id="zout" aria-label="Dézoomer">−</button>
      <button class="zbtn" id="zfit" aria-label="Voir toute la ferme">⤢</button>
    </div>

    <p class="plan-hint" id="hint">Glisser pour se déplacer · molette ou pincer pour zoomer · toucher une parcelle pour le détail</p>

    <aside class="drawer" id="drawer" aria-labelledby="dr-title" hidden>
      <button class="drawer-close" id="dr-close" aria-label="Fermer">×</button>
      <div id="drawer-body"></div>
    </aside>
  </section>
</main>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="plan.js"></script>
</body>
</html>
