<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGRIWISE · Caméra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1C5 6 3 8.5 3 11a5 5 0 0 0 10 0c0-2.5-2-5-5-10z' fill='%231f6fa3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="hanko" aria-hidden="true">絆</span>AGRIWISE<small>KIZUNA 2026</small></div>
  <nav class="nav" aria-label="Pages">
    <a href="./">Plan de la ferme</a>
    <a href="zone.html">Zone</a>
    <a href="camera.html" aria-current="page">Caméra</a>
  </nav>
  <div class="status" id="status" aria-live="polite"></div>
</header>

<main>
  <section class="panel" aria-labelledby="cams-h" style="margin-bottom:18px">
    <div class="row" style="justify-content:space-between">
      <h2 id="cams-h">Caméras</h2>
      <p class="muted small" id="vision-state"></p>
    </div>
    <div class="cams" id="cams"></div>
  </section>

  <div class="cam-layout">
    <section class="cam-left" aria-labelledby="sel-h">
      <h2 id="sel-h" class="visually-hidden" style="position:absolute;left:-9999px">Photo sélectionnée</h2>
      <div class="photo" id="photo">Aucune photo</div>
      <div class="panel current" style="margin-top:14px" id="current"></div>
    </section>
    <section class="panel cam-proc" aria-labelledby="proc-h">
      <div class="row" style="justify-content:space-between">
        <h2 id="proc-h">Procédure de repérage</h2>
        <p class="muted small" id="proc-meta"></p>
      </div>
      <ol class="procedure" id="procedure"></ol>
    </section>
  </div>

  <section class="panel" style="margin-top:18px" aria-labelledby="hist-h">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h2 id="hist-h">Photos analysées</h2>
      <label class="small">Zone <select id="filter"><option value="">Toutes</option></select></label>
    </div>
    <div class="history" id="history"></div>
  </section>
</main>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="camera.js"></script>
</body>
</html>
